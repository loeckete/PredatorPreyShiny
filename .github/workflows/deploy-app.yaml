name: Test and deploy Shiny app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install build dependencies
        shell: Rscript {0}
        run: install.packages(c('shiny', 'shinylive'))
      - name: Test model and parse app
        run: Rscript tests/model-tests.R
      - name: Export browser app
        shell: Rscript {0}
        run: |
          shinylive::export('.', 'site')
          file.create('site/.nojekyll')
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
